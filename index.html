    .landscape-country-badge img { display:block; width:16px; height:11px; object-fit:contain; }
    .landscape-dormant-label { flex:none; color:#d8ba7d; font-size:.62em; font-weight:900; letter-spacing:.02em; white-space:nowrap; text-shadow:0 1px 2px rgba(0,0,0,.78); }

      grid-template-columns: auto auto auto;
      grid-template-areas:
        "icon label time"
        "icon exact exact";
      align-items: center;
      justify-content: center;
      column-gap: 5px;
      row-gap: 2px;
      font-size: 0.72rem;

      padding: 3px 10px;

    .last-seen-badge[data-last-seen-scope] {
      position: relative;
      cursor: help;
      outline: none;
    }

    .last-seen-badge[data-last-seen-scope]::after {
      content: attr(data-last-seen-scope);
      position: absolute;
      z-index: 120;
      left: 50%;
      top: calc(100% + 7px);
      width: max-content;
      max-width: min(230px, calc(100vw - 32px));
      padding: 7px 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.96);

      font-size: 0.66rem;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: 0.02em;
      text-align: center;
      white-space: normal;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -4px);
      transition: opacity 0.16s ease, transform 0.16s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .last-seen-badge[data-last-seen-scope]:hover::after,
      .last-seen-badge[data-last-seen-scope]:focus-visible::after {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    @media (hover: none), (pointer: coarse) {
      .last-seen-badge[data-last-seen-scope]::after {
        width: calc(100% - 8px);
        max-width: none;
        box-sizing: border-box;
      }

      .last-seen-badge[data-last-seen-scope].scope-open::after {

        transform: translate(-50%, 0);
      }

      '#ec4899', '#f43f5e', '#fb923c', '#f59e0b', '#eab308',

    let toastTimer = null;

    let currentTheme = 'wanted'; // 'wanted', 'modern', or 'japanese'

    // === 12h閾ｪ蜍墓峩譁ｰ縺ｮ驥崎､・壻ｿ｡髦ｲ豁｢ ===
    const backgroundFetchIds = new Set(); // 繝ｪ繧ｹ繝亥・菴薙〒縺ｯ縺ｪ縺上・繝ｬ繧､繝､繝ｼID蜊倅ｽ阪〒邂｡逅・    const backgroundStatsQueue = [];
    let backgroundStatsQueueRunning = false;
    const waitForStatsIntegration = (timeoutMs = 6000) => {
      if (window.kentomoStatsIntegrationReady) return Promise.resolve(true);
      return new Promise(resolve => {
        let settled = false;
        const onReady = () => finish(true);
        const finish = value => {
          if (settled) return;
          settled = true;
          window.removeEventListener('kentomo:stats-integration-ready', onReady);
          clearTimeout(timer);
          resolve(value);
        };
        const timer = setTimeout(() => finish(Boolean(window.kentomoStatsIntegrationReady)), timeoutMs);
        window.addEventListener('kentomo:stats-integration-ready', onReady, { once: true });
      });
    };
    const reportQueuedBackgroundFetch = (job, message = '繝ｪ繧ｹ繝亥・縺ｮ蜿門ｾ鈴・ｒ蠕・▲縺ｦ縺・∪縺・) => {
      window.dispatchEvent(new CustomEvent('kentomo:fetch-progress', {
        detail: { memberKey: job.memberKey, gameId: job.gameId, stage: 'queued', at: Date.now(), message }
      }));
    };
    const scheduleBackgroundStatsFetch = (job, retryDelayMs = 0) => {
      const gameId = cleanTekkenId(job?.gameId);
      if (!gameId || backgroundFetchIds.has(gameId)) return false;
      backgroundFetchIds.add(gameId);
      const queuedJob = { ...job, gameId, attempts: Number(job.attempts || 0) };
      reportQueuedBackgroundFetch(queuedJob);
      const enqueue = () => {
        backgroundStatsQueue.push(queuedJob);
        drainBackgroundStatsQueue();
      };
      if (retryDelayMs > 0) setTimeout(enqueue, retryDelayMs);
      else enqueue();
      return true;
    };
    async function drainBackgroundStatsQueue() {
      if (backgroundStatsQueueRunning) return;
      backgroundStatsQueueRunning = true;
      try {
        while (backgroundStatsQueue.length) {
          const job = backgroundStatsQueue.shift();
          const member = window.currentMembersData?.[job.memberKey];
          if (!member || cleanTekkenId(member.gameId).toUpperCase() !== job.gameId.toUpperCase()) {
            backgroundFetchIds.delete(job.gameId);
            continue;
          }
          const ready = await waitForStatsIntegration();
          if (!ready) {
            backgroundFetchIds.delete(job.gameId);
            if (job.attempts < 2) {
              scheduleBackgroundStatsFetch({ ...job, attempts: job.attempts + 1 }, 5000);
            } else {
              window.dispatchEvent(new CustomEvent('kentomo:fetch-progress', {
                detail: {
                  memberKey: job.memberKey, gameId: job.gameId, stage: 'error', at: Date.now(),
                  errorMessage: '邨ｱ險医Δ繧ｸ繝･繝ｼ繝ｫ縺ｮ襍ｷ蜍輔ｒ遒ｺ隱阪〒縺阪∪縺帙ｓ縲ょ・隱ｭ縺ｿ霎ｼ縺ｿ蠕後↓蜀崎ｩｦ陦後＠縺ｦ縺上□縺輔＞縲・
                }
              }));
            }
            continue;
          }
          let stats = null;
          try {
            stats = await fetchEwgfStats(job.gameId, false, job.memberKey, false, job.playerName || '');
          } catch (error) {
            console.warn('Queued background stats fetch failed', job.gameId, error);
          } finally {
            backgroundFetchIds.delete(job.gameId);
          }
          window.refreshVisibleStats?.();
          const failed = !stats || stats.isError || stats.refreshFailed;
          if (failed && job.attempts < 2) {
            scheduleBackgroundStatsFetch({ ...job, attempts: job.attempts + 1 }, 45000 * (job.attempts + 1));
          }
          // Keep a list re-open from becoming a burst of cold EWGF requests.
          await new Promise(resolve => setTimeout(resolve, 900));
        }
      } finally {
        backgroundStatsQueueRunning = false;
      }
    }
    const canonicalTekkenIdLookupCache = new Map();

    function cleanTekkenId(rawId) {
      if (!rawId) return '';
      return rawId.replace(/[-繝ｼ竏箪s]/g, '').trim();
    }

    // SVG Icons
    const ICON_EDIT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`;
    const ICON_DELETE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;
    const ICON_X = `<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>`;
    const ICON_LIGHTNING = `<svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>`;
    const ICON_WAVU = `<svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 12l10 5 10-5"/></svg>`;

    function init() {
      const savedTheme = localStorage.getItem('preferred_theme');
      if (['wanted', 'modern', 'japanese'].includes(savedTheme)) {
        currentTheme = savedTheme;
      }
      document.getElementById('themeSelectDropdown').value = currentTheme;

    function processImageFile(file) {

      // Realtime Database縺ｸ蟾ｨ螟ｧ縺ｪBase64逕ｻ蜒上ｒ蜈･繧後↑縺・らｵｵ譟・↓繧医▲縺ｦ

    function getInitials(name) {

    /* ===== Prototype Stats & Radar Chart Logic (ewgf.gg Official API) ===== */
    const DEFAULT_EWGF_API_KEY = '';
    const LOCAL_STATS_CACHE_KEY = 't8_wanted_ewgf_stats_v3';
    const CACHE_TTL_MS = 12 * 60 * 60 * 1000; // 閾ｪ蜍墓峩譁ｰ: 12譎る俣繧ｭ繝｣繝・す繝･

    function getEwgfApiKey() {
      return localStorage.getItem('t8_ewgf_api_key') || DEFAULT_EWGF_API_KEY;
    }

    function setEwgfApiKey(key) {
      if (key) localStorage.setItem('t8_ewgf_api_key', key.trim());
    }

    const ACTIVITY_STATS_FIELDS = new Set([
      'lastSeenTimestamp', 'latestBattleCharacter', 'latestBattleType',
      'latestBattleCheckedAt', 'latestBattleRevisionAt',
      'recentRankedGames7d', 'recentRankedGames30d',
      'recentRankedSampleSize', 'latestRankedBattleAt', 'returnTracking'
    ]);
    function normalizeStoredStats(stats) {
      if (!stats || typeof stats !== 'object') return stats;
      if (!stats.profileStats && !stats.activityStats) return stats;
      const legacyFlatStats = Object.fromEntries(
        Object.entries(stats).filter(([field]) =>
          !['schema', 'profileStats', 'activityStats', 'fetchMeta', 'cachedAt', 'updatedAt'].includes(field)
        )
      );
      return {
        ...legacyFlatStats,
        ...(stats.profileStats || {}),
        ...(stats.activityStats || {}),
        fetchMeta: stats.fetchMeta || null,
        cachedAt: Number(stats.cachedAt || 0),
        updatedAt: Number(stats.updatedAt || stats.cachedAt || 0)
      };
    }
    function structureStatsForFirebase(stats) {
      if (!stats || typeof stats !== 'object') return stats;
      const profileStats = {};
      const activityStats = {};
      Object.entries(stats).forEach(([field, value]) => {
        if (value === undefined || ['fetchMeta', 'cachedAt', 'updatedAt'].includes(field)) return;
        if (ACTIVITY_STATS_FIELDS.has(field)) activityStats[field] = value;
        else profileStats[field] = value;
      });
      return {
        schema: '20260729-split-fetched-stats',
        profileStats,
        activityStats,
        fetchMeta: stats.fetchMeta || { state: stats.isError ? 'error' : 'ready' },
        cachedAt: Number(stats.cachedAt || Date.now()),
        updatedAt: Number(stats.updatedAt || Date.now())
      };
    }

    const RETURN_BADGE_DURATION_MS = 3 * 24 * 60 * 60 * 1000;
    const returnTrackingTimestamp = value => {
      const timestamp = typeof value === 'number' ? value : Date.parse(String(value || ''));
      return Number.isFinite(timestamp) && timestamp > 0 ? timestamp : 0;
    };
    const isDormantForReturnTracking = stats => typeof window.isDormantStats === 'function'
      ? window.isDormantStats(stats)
      : Boolean(stats?.rankIsAllTimeHighest || stats?.ratingIsHistorical)
        && !(Number(stats?.recentRankedGames7d || 0) >= 3 || Number(stats?.recentRankedGames30d || 0) >= 10);
    function makeDormantReturnBaseline(latestRankedBattleAt, now = Date.now()) {
      return {
        schema: '20260801-return-player',
        dormantSince: now,
        baselineLatestRankedBattleAt: latestRankedBattleAt || '',
        returnReportedAt: 0,
        returnBadgeUntil: 0,
        returnedBattleAt: ''
      };
    }
    function resolveDormantReturnTracking(previousStats, nextStats, now = Date.now()) {
      const previousTracking = previousStats?.returnTracking && typeof previousStats.returnTracking === 'object'
        ? previousStats.returnTracking : null;
      const wasDormant = isDormantForReturnTracking(previousStats);
      const isDormant = isDormantForReturnTracking(nextStats);
      const nextLatest = returnTrackingTimestamp(nextStats?.latestRankedBattleAt);
      const baselineLatest = returnTrackingTimestamp(previousTracking?.baselineLatestRankedBattleAt || previousStats?.latestRankedBattleAt);
      const hasNewRankedBattle = Boolean(nextLatest && baselineLatest && nextLatest > baselineLatest);

      // The first post-update read creates a baseline only. It must never
      // announce an old battle as a new return for existing cards.
      if (!previousTracking) {
        return isDormant ? makeDormantReturnBaseline(nextStats?.latestRankedBattleAt, now) : null;
      }
      // A player who became active has finished this dormant episode. Keep a
      // currently visible badge until it expires, then discard the episode.
      if (!isDormant) {
        if (wasDormant && !previousTracking.returnReportedAt && hasNewRankedBattle) {
          return {
            ...previousTracking,
            returnReportedAt: now,
            returnBadgeUntil: now + RETURN_BADGE_DURATION_MS,
            returnedBattleAt: nextStats.latestRankedBattleAt || ''
          };
        }
        if (Number(previousTracking.returnBadgeUntil || 0) > now) {
          return { ...previousTracking, dormantEndedAt: now };
        }
        return null;
      }
      // A later dormant period is a fresh episode and is allowed one new
      // return notification.
      if (previousTracking.dormantEndedAt) {
        return makeDormantReturnBaseline(nextStats?.latestRankedBattleAt, now);
      }
      if (!previousTracking.returnReportedAt && hasNewRankedBattle) {
        return {
          ...previousTracking,
          returnReportedAt: now,
          returnBadgeUntil: now + RETURN_BADGE_DURATION_MS,
          returnedBattleAt: nextStats.latestRankedBattleAt || ''
        };
      }
      return previousTracking;
    }
    window.resolveDormantReturnTracking = resolveDormantReturnTracking;
    window.isDormantReturnVisible = tracking => Boolean(
      tracking && Number(tracking.returnReportedAt || 0) > 0 && Number(tracking.returnBadgeUntil || 0) > Date.now()
    );
    window.getDormantReturnElapsedDays = tracking => {
      const from = returnTrackingTimestamp(tracking?.baselineLatestRankedBattleAt);
      const to = returnTrackingTimestamp(tracking?.returnedBattleAt);
      if (!from || !to || to <= from) return 0;
      const jstOffset = 9 * 60 * 60 * 1000;
      return Math.max(1, Math.floor((Math.floor((to + jstOffset) / 86400000) - Math.floor((from + jstOffset) / 86400000))));
    };
    window.ensureDormantReturnTracking = (memberKey, member, stats) => {
      if (!stats || !memberKey || !member) return stats?.returnTracking || null;
      const nextTracking = resolveDormantReturnTracking(stats, stats);
      const currentTracking = stats.returnTracking || null;
      if (JSON.stringify(currentTracking) === JSON.stringify(nextTracking)) return currentTracking;
      if (nextTracking) stats.returnTracking = nextTracking;
      else delete stats.returnTracking;
      const gameId = cleanTekkenId(member.gameId || stats.gameId || '');
      if (gameId) {
        try { localStorage.setItem(`${LOCAL_STATS_CACHE_KEY}_${gameId}`, JSON.stringify(stats)); } catch (_) {}
      }
      if (membersRef) {
        membersRef.child(memberKey).child('fetchedStats/activityStats/returnTracking').set(nextTracking || null)
          .catch(error => console.warn('Return tracking sync failed', error));
      }
      if (member.fetchedStats?.activityStats) member.fetchedStats.activityStats.returnTracking = nextTracking || null;
      return nextTracking;
    };

    function getLocalStats(gameId, memberData = null) {
      // 蜷後§TEKKEN ID縺ｯ繝ｪ繧ｹ繝医ｒ縺ｾ縺溘＞縺ｧ1縺､縺ｮ繧ｭ繝｣繝・す繝･縺ｨ縺励※謇ｱ縺・・      // 蜷・Μ繧ｹ繝医・Firebase縺ｫ谿九▲縺溷商縺・etchedStats縺ｧ縲∵眠縺励＞蜈ｱ騾壹く繝｣繝・す繝･繧剃ｸ頑嶌縺阪＠縺ｪ縺・・      let localStats = null;
      try {
        const raw = localStorage.getItem(`${LOCAL_STATS_CACHE_KEY}_${gameId}`);
        if (raw) localStats = JSON.parse(raw);
      } catch (e) {}

      const memberStats = memberData && memberData.fetchedStats
        ? normalizeStoredStats(memberData.fetchedStats)
        : null;
      if (!localStats && !memberStats) return null;
      if (!localStats) {
        try {
          localStorage.setItem(`${LOCAL_STATS_CACHE_KEY}_${gameId}`, JSON.stringify(memberStats));
        } catch (e) {}
        return memberStats;
      }
      if (!memberStats) return localStats;

      const localTime = Number(localStats.cachedAt || localStats.updatedAt || 0);
      const memberTime = Number(memberStats.cachedAt || memberStats.updatedAt || 0);
      // 騾壻ｿ｡螟ｱ謨励・譁ｰ縺励＞險倬鹸縺ｧ縲・℃蜴ｻ縺ｮ豁｣蟶ｸ繝・・繧ｿ繧定ｦ・ｏ縺ｪ縺・・      const localFailed = Boolean(localStats.isError || localStats.refreshFailed);
      const memberFailed = Boolean(memberStats.isError || memberStats.refreshFailed);
      const newer = localFailed !== memberFailed
        ? (localFailed ? memberStats : localStats)
        : (localTime >= memberTime ? localStats : memberStats);
      const older = newer === localStats ? memberStats : localStats;
      const merged = { ...older, ...newer };
      if (!newer.statPentagon && older.statPentagon) merged.statPentagon = older.statPentagon;
      // Latest-battle polling must not make the 12-hour profile/rating cache
      // immortal. Merge battle details by their own revision timestamp.
      const localBattleRevision = Number(localStats.latestBattleRevisionAt || localStats.latestBattleCheckedAt || 0);
      const memberBattleRevision = Number(memberStats.latestBattleRevisionAt || memberStats.latestBattleCheckedAt || 0);
      const newestBattle = localBattleRevision >= memberBattleRevision ? localStats : memberStats;
      for (const field of [
        'lastSeenTimestamp', 'latestBattleCharacter', 'latestBattleType',
        'latestBattleCheckedAt', 'latestBattleRevisionAt'
      ]) {
        if (newestBattle[field] !== undefined && newestBattle[field] !== null) merged[field] = newestBattle[field];
      }
      try {
        localStorage.setItem(`${LOCAL_STATS_CACHE_KEY}_${gameId}`, JSON.stringify(merged));
      } catch (e) {}
      return merged;
    }

    function setLocalStats(gameId, stats, memberKey = null) {
      try {
        // A partial/transient refresh must never erase previously valid visual
        // data. This also protects the short interval before enhancement scripts
        // finish loading.
        const previousStats = getLocalStats(gameId);
        if ((stats.isError || stats.refreshFailed) && previousStats && !previousStats.isError && !previousStats.refreshFailed) {
          return previousStats;
        }
        if (previousStats) {
          const sameCharacter = String(stats.mainChar || '').toLowerCase().replace(/[^a-z0-9]/g, '')
            === String(previousStats.mainChar || '').toLowerCase().replace(/[^a-z0-9]/g, '');
          for (const field of [
            'statPentagon', 'latestBattleCharacter', 'latestBattleType',
            'platform', 'platformId', 'platformProfileUrl'
          ]) {
            if (!stats[field] && previousStats[field]) stats[field] = previousStats[field];
          }
          // A 12-hour profile refresh can be older than the lightweight latest
          // battle refresh. Never roll the visible battle time/details back.
          const previousBattleTime = Number(previousStats.lastSeenTimestamp || 0);
          const incomingBattleTime = Number(stats.lastSeenTimestamp || 0);
          if (previousBattleTime > incomingBattleTime) {
            stats.lastSeenTimestamp = previousBattleTime;
            stats.latestBattleCharacter = previousStats.latestBattleCharacter || stats.latestBattleCharacter || '';
            stats.latestBattleType = previousStats.latestBattleType || stats.latestBattleType || '';
            stats.latestBattleCheckedAt = previousStats.latestBattleCheckedAt || stats.latestBattleCheckedAt;
          }
          if (sameCharacter) {
            for (const field of ['mainCharImage', 'rankIcon']) {
              if (!stats[field] && previousStats[field]) stats[field] = previousStats[field];
            }
          }
        }
        // A successful profile result is the terminal state of the initial
        // placeholder. Clear both storage forms so a later list render cannot
        // resurrect the frozen "貅門ｙ荳ｭ" card.
        if (!stats.isError && !stats.refreshFailed) delete stats.initialFetchPending;
        stats.cachedAt = Date.now();
        localStorage.setItem(`${LOCAL_STATS_CACHE_KEY}_${gameId}`, JSON.stringify(stats));

        // 髱槫酔譛溷叙蠕励・螳御ｺ・ｾ後↓蛻･繝ｪ繧ｹ繝医∈蛻・ｊ譖ｿ繧上▲縺ｦ縺・ｋ蝣ｴ蜷医∫樟蝨ｨ縺ｮ繝ｪ繧ｹ繝医∈
        // fetchedStats縺縺代・繧ｴ繝ｼ繧ｹ繝医Γ繝ｳ繝舌・繧剃ｽ懊ｉ縺ｪ縺・ら樟蝨ｨ陦ｨ遉ｺ荳ｭ縺ｮ螳溷惠繝｡繝ｳ繝舌・縺ｨ
        // TEKKEN 8 ID縺御ｸ閾ｴ縺吶ｋ蝣ｴ蜷医↓髯舌▲縺ｦFirebase縺ｸ蜷梧悄縺吶ｋ縲・        if (!membersRef || !window.currentMembersData) return;

        let verifiedKey = null;
        if (memberKey) {
          const member = window.currentMembersData[memberKey];
          if (
            member &&
            (
              cleanTekkenId(member.gameId) === cleanTekkenId(gameId) ||
              cleanTekkenId(member.gameId).toUpperCase() === cleanTekkenId(gameId).toUpperCase()
            )
          ) {
            verifiedKey = memberKey;
          }
        } else {
          for (const [key, member] of Object.entries(window.currentMembersData)) {
            if (member && cleanTekkenId(member.gameId) === cleanTekkenId(gameId)) {
              verifiedKey = key;
              break;
            }
          }
        }
        if (!verifiedKey) {
          console.info('Skipped stale stats write after list switch', gameId, memberKey);
          return;
        }

        const memberStatsUpdate = { fetchedStats: structureStatsForFirebase(stats) };
        const verifiedMember = window.currentMembersData[verifiedKey];
        const fetchedPlayerName = String(stats.playerName || '').trim().slice(0, 50);
        if (verifiedMember && fetchedPlayerName) {
          const now = Date.now();
          memberStatsUpdate.autoName = fetchedPlayerName;
          memberStatsUpdate.autoNameUpdatedAt = now;
          const currentName = String(verifiedMember.name || '').trim();
          const currentNameIsId = !currentName
            || cleanTekkenId(currentName).toUpperCase() === cleanTekkenId(gameId).toUpperCase();
          // An auto-following name can temporarily be the generic Player
          // Profile label after an earlier failed lookup. Keep following in
          // that state too; only a manual name must remain untouched.
          if (verifiedMember.nameMode === 'auto' || currentNameIsId) {
            memberStatsUpdate.name = fetchedPlayerName;
            memberStatsUpdate.nameSource = 'ewgf-profile';
            memberStatsUpdate.nameUpdatedAt = now;
          }
          Object.assign(verifiedMember, memberStatsUpdate);
        }
        membersRef.child(verifiedKey).update(memberStatsUpdate)
          .catch(error => {
            console.warn('Stats Firebase sync failed', error);
          });
      } catch (e) {
        console.error('Stats cache write error', e);
      }
    }
    function formatTimeAgo(ts) {
      if (!ts) return '譛ｪ險域ｸｬ';
      const diffSec = Math.floor((Date.now() - ts) / 1000);
      if (diffSec < 60) return '縺溘▲縺滉ｻ・;
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin}蛻・燕`;
      const diffHour = Math.floor(diffMin / 60);
      if (diffHour < 24) return `${diffHour}譎る俣蜑港;
      const diffDay = Math.floor(diffHour / 24);
      if (diffDay < 30) return `${diffDay}譌･蜑港;
      return new Date(ts).toLocaleDateString('ja-JP');
    }

    function formatExactDateTime(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const date = String(d.getDate()).padStart(2, '0');
      const hours = String(d.getHours()).padStart(2, '0');
      const minutes = String(d.getMinutes()).padStart(2, '0');
      return `${year}/${month}/${date} ${hours}:${minutes}`;
    }

    function getLastSeenBadgeHtml(ts, battle = null) {
      const scopeText = 'Ranked / Group / Player / Quick 縺ｮ蜈ｨ蟇ｾ謌ｦ繧貞ｯｾ雎｡';
      const scopeAttrs = `tabindex="0" role="button" data-last-seen-scope="${scopeText}" aria-label="譛邨ょｯｾ謌ｦ縲・{scopeText}"`;
      if (!ts) {

    // 繝壹・繧ｸ讒矩縺ｮ蟆上＆縺ｪ螟画峩縺ｧ螢翫ｌ繧九◆繧√∝推繧ｫ繝ｼ繝峨ｒ迢ｬ遶九＠縺ｦ隗｣譫舌☆繧九・    function parseWavuRatings(html) {
      const charGamesMap = {};

      const doc = new DOMParser().parseFromString(html, 'text/html');

        const muMatch = muText.match(/ﾎｼ\s*([\d,]+)/u);
        const sigmaMatch = sigmaText.match(/ﾏδｲ\s*([\d,]+)/u);
        const gamesMatch = gamesText.match(/([\d,]+)\s*games?/i);
        if (!charName || !gamesMatch) return;

        charGamesMap[charName] = Number(gamesMatch[1].replace(/,/g, ''));

    function drawRadarChart(canvasId, stats) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;

      const width = canvas.clientWidth || 170;
      const height = canvas.clientHeight || 135;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);

      ctx.clearRect(0, 0, width, height);

      const centerX = width / 2;
      const centerY = height / 2 + 5;
      const radius = Math.min(width, height) / 2 - 22;
      const sides = 5;

      const labels = ['ATTACK', 'TECH', 'APPEAL', 'SPIRIT', 'DEFENSE'];

      let scores = null;
      if (stats && stats.customStats) {
        scores = [
          (stats.customStats.attack || 50) / 100,
          (stats.customStats.technique || 50) / 100,
          (stats.customStats.appeal || 50) / 100,
          (stats.customStats.spirit || 50) / 100,
          (stats.customStats.defense || 50) / 100
        ];
      }

      ctx.strokeStyle = currentTheme === 'modern' ? 'rgba(255,255,255,0.15)' : (currentTheme === 'japanese' ? 'rgba(99,102,241,0.25)' : 'rgba(140,106,70,0.3)');
      ctx.lineWidth = 1;

      for (let level = 1; level <= 3; level++) {
        const r = (radius / 3) * level;
        ctx.beginPath();
        for (let i = 0; i < sides; i++) {
          const angle = (Math.PI * 2 / sides) * i - Math.PI / 2;
          const x = centerX + r * Math.cos(angle);
          const y = centerY + r * Math.sin(angle);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      }

      ctx.font = '700 7.5px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = currentTheme === 'modern' ? '#94a3b8' : (currentTheme === 'japanese' ? '#4338ca' : '#5c3a21');

      for (let i = 0; i < sides; i++) {
        const angle = (Math.PI * 2 / sides) * i - Math.PI / 2;
        const x = centerX + radius * Math.cos(angle);
        const y = centerY + radius * Math.sin(angle);

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(x, y);
        ctx.stroke();

        const labelX = centerX + (radius + 12) * Math.cos(angle);
        const labelY = centerY + (radius + 9) * Math.sin(angle);
        ctx.fillText(labels[i], labelX, labelY);
      }

      if (scores) {
        ctx.beginPath();
        for (let i = 0; i < sides; i++) {
          const angle = (Math.PI * 2 / sides) * i - Math.PI / 2;
          const r = radius * scores[i];
          const x = centerX + r * Math.cos(angle);
          const y = centerY + r * Math.sin(angle);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();

        if (currentTheme === 'modern') {
          ctx.fillStyle = 'rgba(129, 140, 248, 0.4)';
          ctx.strokeStyle = '#818cf8';
        } else if (currentTheme === 'japanese') {
          ctx.fillStyle = 'rgba(99, 102, 241, 0.35)';
          ctx.strokeStyle = '#4338ca';
        } else {
          ctx.fillStyle = 'rgba(139, 0, 0, 0.35)';
          ctx.strokeStyle = '#8b0000';
        }
        ctx.lineWidth = 2;
        ctx.fill();
        ctx.stroke();
      } else {
        ctx.font = '600 7px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = currentTheme === 'modern' ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.3)';
        ctx.fillText('邱ｨ髮・〒繧ｰ繝ｩ繝戊ｨｭ螳・, centerX, centerY);
      }
    }

    function acquisitionStateFor(member, stats, liveProgress = null) {
      if (liveProgress?.stage && FETCH_STAGE_VIEW[liveProgress.stage]) {
        return { ...FETCH_STAGE_VIEW[liveProgress.stage], ...liveProgress };
      }
      const meta = stats?.fetchMeta || member?.fetchedStats?.fetchMeta || {};
      const isBackgroundSync = meta.fetchedBy === 'worker-background-10min'
        || stats?.statsSource === '20260801-server-background-sync';
      if (stats?.isError || stats?.refreshFailed || meta.state === 'error') {
        return {
          ...FETCH_STAGE_VIEW.error,
          errorMessage: stats?.refreshErrorMessage || meta.errorMessage || '',
          errorStatus: stats?.refreshErrorStatus || meta.errorStatus || null
        };
      }
      if (stats && !stats.initialFetchPending && stats.statsSource === '20260729-main-character-reasons') {
        if (meta.sourceErrors && Object.keys(meta.sourceErrors).length) {
          return { ...FETCH_STAGE_VIEW.partial, stats };
        }
        // On initial render this is necessarily a stored snapshot. Only a live
        // completed fetch event may call it "latest data".
        return { ...FETCH_STAGE_VIEW.cached, stats };
      }
      if (stats && !stats.initialFetchPending && isBackgroundSync) {
        return {
          ...FETCH_STAGE_VIEW.cached,
          label: '螳悟・閾ｪ蜍募叙蠕・,
          detail: '繝舌ャ繧ｯ繧ｰ繝ｩ繧ｦ繝ｳ繝芽・蜍募叙蠕励・菫晏ｭ倡ｵ先棡縺ｧ縺・,
          stats
        };
      }
      if (member?.initialFetchPending || stats?.initialFetchPending || meta.state === 'saved') {
        return { ...FETCH_STAGE_VIEW.saved };
      }
      return { ...FETCH_STAGE_VIEW.cached, label: '蜿門ｾ礼憾諷倶ｸ肴・', detail: '菫晏ｭ俶凾蛻ｻ繧堤｢ｺ隱阪〒縺阪∪縺帙ｓ' };
    }

    function acquisitionStatusHtml(memberKey, member, stats) {
      const state = acquisitionStateFor(member, stats, fetchProgressByMember.get(memberKey));
      const progress = Math.max(8, Math.min(100, Number(state.step || 1) * 20));
      const isPending = state.tone === 'pending';
      return `
        <button type="button" class="data-reliability-badge tone-${state.tone}" onclick="openFetchDiagnostics('${escapeHtml(memberKey)}')" title="繝・・繧ｿ蜿門ｾ礼憾諷九→險ｺ譁ｭ繧定｡ｨ遉ｺ">
          <span class="data-reliability-icon">${escapeHtml(state.icon)}</span>
          <span>${escapeHtml(state.label)}</span>
        </button>
        ${isPending ? `
          <div class="initial-fetch-progress" aria-label="${escapeHtml(state.label)}">
            <div class="initial-fetch-progress-track"><span style="width:${progress}%"></span></div>
            <small>${escapeHtml(state.detail || '')}</small>
          </div>
        ` : ''}
      `;
    }

    function updateCardAcquisitionStatus(memberKey, stats = null) {
      const member = window.currentMembersData?.[memberKey];
      const holder = document.querySelector(`[data-acquisition-member="${CSS.escape(memberKey)}"]`);
      if (!member || !holder) return;
      const resolvedStats = stats || getLocalStats(cleanTekkenId(member.gameId), member);
      const liveProgress = fetchProgressByMember.get(memberKey);
      const completedAt = Number(resolvedStats?.fetchMeta?.completedAt || resolvedStats?.cachedAt || 0);
      const hasCompletedStats = Boolean(
        resolvedStats
        && !resolvedStats.initialFetchPending
        && (
          resolvedStats.statsSource === '20260729-main-character-reasons'
          || resolvedStats.statsSource === '20260801-server-background-sync'
          || resolvedStats.fetchMeta?.fetchedBy === 'worker-background-10min'
        )
      );
      // A fetch may begin before the late-loaded stats integration has installed
      // its progress events. In that route the saved placeholder used to remain
      // visible forever even though Firebase/local storage already held results.
      if (hasCompletedStats && (!liveProgress || completedAt >= Number(liveProgress.at || 0))) {
        fetchProgressByMember.delete(memberKey);
      }
      const nextHtml = acquisitionStatusHtml(memberKey, member, resolvedStats);

    const COUNTRY_CODES = 'AD AE AF AG AI AL AM AO AQ AR AS AT AU AW AX AZ BA BB BD BE BF BG BH BI BJ BL BM BN BO BQ BR BS BT BV BW BY BZ CA CC CD CF CG CH CI CK CL CM CN CO CR CU CV CW CX CY CZ DE DJ DK DM DO DZ EC EE EG EH ER ES ET FI FJ FK FM FO FR GA GB GD GE GF GG GH GI GL GM GN GP GQ GR GS GT GU GW GY HK HM HN HR HT HU ID IE IL IM IN IO IQ IR IS IT JE JM JO JP KE KG KH KI KM KN KP KR KW KY KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MF MG MH MK ML MM MN MO MP MQ MR MS MT MU MV MW MX MY MZ NA NC NE NF NG NI NL NO NP NR NU NZ OM PA PE PF PG PH PK PL PM PN PR PS PT PW PY QA RE RO RS RU RW SA SB SC SD SE SG SH SI SJ SK SL SM SN SO SR SS ST SV SX SY SZ TC TD TF TG TH TJ TK TL TM TN TO TR TT TV TW TZ UA UG UM US UY UZ VA VC VE VG VI VN VU WF WS YE YT ZA ZM ZW'.split(' ');
    const regionNames = typeof Intl.DisplayNames === 'function'
      ? new Intl.DisplayNames(['ja'], { type: 'region' })
      : null;

    function normalizeCountryCode(value) {
      const code = String(value || '').trim().toUpperCase();
      return COUNTRY_CODES.includes(code) ? code : '';
    }

    function countryFlagEmoji(code) {
      return [...code].map(char => String.fromCodePoint(127397 + char.charCodeAt(0))).join('');
    }

    function countryFlagImageUrl(code) {
      const codePoints = [...countryFlagEmoji(code)]
        .map(char => char.codePointAt(0).toString(16))
        .join('-');
      return `https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/${codePoints}.svg`;
    }

    function countryDisplayName(code) {
      try { return regionNames ? regionNames.of(code) : code; }
      catch (_) { return code; }
    }

    function populateCountryOptions() {
      const select = document.getElementById('inputCountry');
      if (!select || select.options.length > 1) return;
      const fragment = document.createDocumentFragment();
      COUNTRY_CODES
        .map(code => ({ code, name: countryDisplayName(code) }))
        .sort((a, b) => a.name.localeCompare(b.name, 'ja'))
        .forEach(({ code, name }) => {
          const option = document.createElement('option');
          option.value = code;
          option.textContent = `${name} (${code})`;
          fragment.appendChild(option);
        });
      select.appendChild(fragment);
      const menu = document.getElementById('countryPickerMenu');
      if (menu && !menu.children.length) {
        const unset = document.createElement('button');
        unset.type = 'button';
        unset.className = 'country-picker-option';
        unset.dataset.countryCode = '';
        unset.textContent = '譛ｪ險ｭ螳夲ｼ医き繝ｼ繝峨↓縺ｯ陦ｨ遉ｺ縺励↑縺・ｼ・;
        menu.appendChild(unset);
        for (const option of [...select.options].slice(1)) {
          const code = option.value;
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'country-picker-option';
          button.dataset.countryCode = code;
          button.setAttribute('role', 'option');
          button.innerHTML = `<img src="${countryFlagImageUrl(code)}" alt=""><span>${escapeHtml(option.textContent)}</span>`;
          menu.appendChild(button);
        }
        menu.addEventListener('click', event => {
          const option = event.target.closest('.country-picker-option');
          if (!option) return;
          select.value = option.dataset.countryCode || '';
          updateCountryPreview();
          closeCountryPicker();
        });
      }
      const pickerButton = document.getElementById('countryPickerButton');
      if (pickerButton && !pickerButton.dataset.bound) {
        pickerButton.dataset.bound = 'true';
        pickerButton.addEventListener('click', () => {
          const isOpen = !menu.hidden;
          menu.hidden = isOpen;
          pickerButton.setAttribute('aria-expanded', String(!isOpen));
        });
        document.addEventListener('click', event => {
          if (!event.target.closest('#countryPicker')) closeCountryPicker();
        });
      }
      updateCountryPreview();
    }

    function closeCountryPicker() {
      const menu = document.getElementById('countryPickerMenu');
      const button = document.getElementById('countryPickerButton');
      if (menu) menu.hidden = true;
      if (button) button.setAttribute('aria-expanded', 'false');
    }

    function updateCountryPreview() {
      const select = document.getElementById('inputCountry');
      const content = document.getElementById('countryPickerButtonContent');
      if (!select || !content) return;
      const code = normalizeCountryCode(select.value);
      if (!code) {
        content.innerHTML = '譛ｪ險ｭ螳夲ｼ医き繝ｼ繝峨↓縺ｯ陦ｨ遉ｺ縺励↑縺・ｼ・;
        return;
      }
      content.innerHTML = `<img src="${countryFlagImageUrl(code)}" alt=""><span>${escapeHtml(countryDisplayName(code))} (${code})</span>`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function ensureCompactPlayerModal() {
      let modal = document.getElementById('compactPlayerDetailModal');
      if (modal) return modal;
      modal = document.createElement('div');
      modal.id = 'compactPlayerDetailModal';
      modal.className = 'compact-player-modal';
      modal.hidden = true;

      document.body.appendChild(modal);
      let historyEntryActive = false;
      const close = ({ fromHistory = false } = {}) => {
        if (modal.hidden) return;
        modal.hidden = true;
        if (!fromHistory && historyEntryActive) {
          historyEntryActive = false;
          history.back();
        } else {
          historyEntryActive = false;
        }
      };
      modal.openWithHistory = memberKey => {
        if (!historyEntryActive) {
          history.pushState({ ...(history.state || {}), kentomoCompactPlayer: String(memberKey || '') }, '', location.href);
          historyEntryActive = true;
        }
        modal.hidden = false;
      };
      modal.clearInactiveHistory = () => {
        if (!modal.hidden) return;
        historyEntryActive = false;
      };
      modal.querySelector('.compact-player-close').addEventListener('click', close);
      modal.addEventListener('click', event => { if (event.target === modal) close(); });
      document.addEventListener('keydown', event => { if (event.key === 'Escape' && !modal.hidden) close(); });
      window.addEventListener('popstate', event => {
        const restoreKey = String(event.state?.kentomoCompactPlayer || '');
        // Restore from the history entry itself. The in-memory flag can be
        // stale after native Android dialog handling, while this key remains
        // the authoritative parent view.
        if (restoreKey && modal.hidden) {
          historyEntryActive = true;
          openCompactPlayerDetails(restoreKey);
          return;
        }
        if (!modal.hidden && historyEntryActive) close({ fromHistory: true });
      });
      return modal;
    }

    function normalizePlayerMessage(value) {
      let message = String(value || '').replace(/\s+/g, ' ').trim();
      const quotePairs = [['"', '"'], ['窶・, '窶・], ['縲・, '縲・], ["'", "'"], ['窶・, '窶・]];
      let changed = true;
      while (changed && message.length >= 2) {
        changed = false;
        for (const [open, close] of quotePairs) {
          if (message.startsWith(open) && message.endsWith(close)) {
            message = message.slice(open.length, -close.length).trim();
            changed = true;
            break;
          }
        }
      }
      return message.slice(0, 160);
    }

        { cache: 'no-store', signal: controller.signal }
      ).then(async response => {

        const payload = await response.json();

    function parseWavuPlayerSearchResults(text, requestedId) {
      const normalizedRequestedId = cleanTekkenId(requestedId).toUpperCase();
      const candidates = new Map();
      const addCandidate = (candidateIdValue, labelValue) => {
        const candidateId = cleanTekkenId(candidateIdValue);
        if (candidateId.toUpperCase() !== normalizedRequestedId) return;
        const linkLabel = String(labelValue || '').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
        const labelIsId = cleanTekkenId(linkLabel).toUpperCase() === candidateId.toUpperCase();
        const previous = candidates.get(candidateId);
        candidates.set(candidateId, {
          gameId: candidateId,
          playerName: previous?.playerName || (labelIsId ? '' : linkLabel)
        });
      };

      // r.jina.ai 縺瑚ｿ斐☆Markdown蠖｢蠑上・      const linkPattern = /\[([^\]\r\n]+)\]\(https?:\/\/wank\.wavu\.wiki\/player\/([A-Za-z0-9]{12})\)/gi;
      let match;
      while ((match = linkPattern.exec(String(text || ''))) !== null) {
        addCandidate(match[2], match[1]);
      }

      // AllOrigins / corsproxy.io 縺瑚ｿ斐☆Wavu譛ｬ譚･縺ｮHTML蠖｢蠑上・      const htmlLinkPattern = /<a\b[^>]*href=["'](?:https?:\/\/wank\.wavu\.wiki)?\/player\/([A-Za-z0-9]{12})["'][^>]*>([\s\S]*?)<\/a>/gi;
      while ((match = htmlLinkPattern.exec(String(text || ''))) !== null) {
        addCandidate(match[1], match[2]);
      }
      return [...candidates.values()];
    }

    async function resolveCanonicalTekkenId(gameId) {
      const cleanedId = cleanTekkenId(gameId);
      if (!/^[A-Za-z0-9]{12}$/.test(cleanedId)) {
        return { gameId: cleanedId, playerName: '', status: 'invalid-format' };
      }
      // 螟ｧ蟆乗枚蟄励□縺代′驕輔≧蛻･ID縺檎炊隲紋ｸ雁・蟄倥＠縺ｦ繧りｪ､豬∫畑縺励↑縺・ｈ縺・・      // 繧ｭ繝｣繝・す繝･繧ｭ繝ｼ縺ｫ縺ｯ蜈･蜉帙＆繧後◆螟ｧ蟆乗枚蟄励ｒ縺昴・縺ｾ縺ｾ谿九☆縲・      const cacheKey = cleanedId;
      if (canonicalTekkenIdLookupCache.has(cacheKey)) {
        return canonicalTekkenIdLookupCache.get(cacheKey);
      }

      const lookup = (async () => {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 30000);
          try {
            const response = await fetch(
              `https://tight-bar-55c1.uracil123.workers.dev/?mode=resolve-id&gameId=${encodeURIComponent(cleanedId)}`,
              { cache: 'no-store', signal: controller.signal }
            );
            if (response.ok) {
              const payload = await response.json();
              const candidates = Array.isArray(payload.candidates) ? payload.candidates : [];
              if (candidates.length === 1) return { ...candidates[0], status: 'corrected' };
              if (candidates.length > 1) {
                return { gameId: cleanedId, playerName: '', candidates, status: 'ambiguous' };
              }
            }
          } finally {
            clearTimeout(timeoutId);
          }
        } catch (error) {
          console.warn('Confusable TEKKEN 8 ID Worker lookup failed', cleanedId, error);
        }
        const wavuSearchUrl = `https://wank.wavu.wiki/player/search?q=${encodeURIComponent(cleanedId)}`;
        // Jina 縺ｯ讀懃ｴ｢邨先棡繧剃ｸ譎ら噪縺ｫ縲悟呵｣懊↑縺励阪〒繧ｭ繝｣繝・す繝･縺吶ｋ縺薙→縺後≠繧九・        // 繧ｭ繝｣繝・す繝･蝗樣∩繧ｭ繝ｼ繧剃ｻ倥￠縲∝挨CORS邨瑚ｷｯ繧る・分縺ｫ隧ｦ縺吶・        const lookupUrls = [
          `https://r.jina.ai/http://wank.wavu.wiki/player/search?q=${encodeURIComponent(cleanedId)}&kentomo=${Date.now()}`,
          `https://api.allorigins.win/raw?url=${encodeURIComponent(wavuSearchUrl)}`,
          `https://corsproxy.io/?${encodeURIComponent(wavuSearchUrl)}`
        ];
        let lastError = null;
        for (const url of lookupUrls) {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 5500);
          try {
            const response = await fetch(url, { cache: 'no-store', signal: controller.signal });
            if (!response.ok) throw new Error(`Wavu ID讀懃ｴ｢ HTTP ${response.status}`);
            const candidates = parseWavuPlayerSearchResults(await response.text(), cleanedId);
            const exact = candidates.find(candidate => candidate.gameId === cleanedId);
            if (exact) return { ...exact, status: 'exact' };
            if (candidates.length === 1) return { ...candidates[0], status: 'corrected' };
            if (candidates.length > 1) {
              return { gameId: cleanedId, playerName: '', status: 'ambiguous' };
            }
          } catch (error) {
            lastError = error;
            console.warn('Canonical TEKKEN 8 ID lookup route failed', url, error);
          } finally {
            clearTimeout(timeoutId);
          }
        }
        return {
          gameId: cleanedId,
          playerName: '',
          status: lastError ? 'unavailable' : 'not-found'
        };
      })();
      canonicalTekkenIdLookupCache.set(cacheKey, lookup);
      const result = await lookup;
      if (result.status === 'exact' || result.status === 'corrected') {
        canonicalTekkenIdLookupCache.set(cacheKey, result);
      } else {
        canonicalTekkenIdLookupCache.delete(cacheKey);
      }
      return result;
    }
    window.resolveCanonicalTekkenId = resolveCanonicalTekkenId;

    async function persistCanonicalTekkenId(memberKey, previousId, resolvedPlayer) {
      const canonicalId = cleanTekkenId(resolvedPlayer?.gameId);
      const member = memberKey && window.currentMembersData
        ? window.currentMembersData[memberKey]
        : null;
      if (
        !member ||
        !canonicalId ||
        cleanTekkenId(member.gameId).toUpperCase() !== cleanTekkenId(previousId).toUpperCase()
      ) {
        return;
      }

      const idWasCorrected = cleanTekkenId(member.gameId) !== canonicalId;
      const updates = { updatedAt: Date.now() };
      if (idWasCorrected) updates.gameId = canonicalId;
      const currentName = String(member.name || '').trim();
      const isIdPlaceholder = !currentName
        || cleanTekkenId(currentName).toUpperCase() === cleanTekkenId(previousId).toUpperCase();
      if (member.nameMode === 'auto' && isIdPlaceholder && resolvedPlayer.playerName) {
        updates.name = resolvedPlayer.playerName;
        updates.nameSource = 'wavu-profile';
        updates.nameUpdatedAt = Date.now();
      }
      if (resolvedPlayer.playerName) {
        updates.autoName = String(resolvedPlayer.playerName).trim().slice(0, 50);
        updates.autoNameUpdatedAt = Date.now();
      }
      if (Object.keys(updates).length === 1) return;

      Object.assign(member, updates);
      if (membersRef) await membersRef.child(memberKey).update(updates);
      if (idWasCorrected) {
        showToast(`菫晏ｭ俶ｸ医∩ID繧呈ｭ｣蠑剰｡ｨ險倥∈菫ｮ蠕ｩ縺励∪縺励◆・・{previousId} 竊・${canonicalId}`);
      } else if (updates.name) {
        showToast(`${resolvedPlayer.playerName} 縺ｮ繝励Ξ繧､繝､繝ｼ蜷阪ｒ蜿門ｾ励＠縺ｾ縺励◆`);
      }
    }
    window.persistCanonicalTekkenId = persistCanonicalTekkenId;

    async function confirmNewPlayerId(gameId) {
      if (!/^[A-Za-z0-9]{12}$/.test(gameId)) {
        return confirm(
          `TEKKEN 8 ID縲・{gameId}縲阪・12譁・ｭ励〒縺ｯ縺ゅｊ縺ｾ縺帙ｓ縲・n` +
          '繧ｳ繝斐・貍上ｌ繧・・蜉帙Α繧ｹ縺ｮ蜿ｯ閭ｽ諤ｧ縺後≠繧翫∪縺吶′縲√％縺ｮ縺ｾ縺ｾ霑ｽ蜉縺励∪縺吶°・・
        );
      }
      // 逋ｻ骭ｲ謫堺ｽ懊ｒEWGF縺ｮ髫懷ｮｳ繧・Ξ繝ｼ繝亥宛髯舌↓萓晏ｭ倥＆縺帙↑縺・・      // 豁｣縺励＞蠖｢蠑上↑繧牙・縺ｫ菫晏ｭ倥＠縲√・繝ｭ繝輔ぅ繝ｼ繝ｫ遒ｺ隱阪・騾壼ｸｸ縺ｮ蜈ｱ譛峨く繝｣繝・す繝･譖ｴ譁ｰ縺ｸ莉ｻ縺帙ｋ縲・      return true;
    }

    function isUsableInitialMemberStats(stats) {
      return Boolean(
        stats &&
        !stats.isError &&
        !stats.refreshFailed &&
        stats.statsSource === '20260729-main-character-reasons' &&
        stats.mainChar
      );
    }

    async function prepareInitialMemberStats(gameId, playerName) {
      try {
        const stats = await fetchEwgfStats(gameId, false, null, false, playerName);
        return isUsableInitialMemberStats(stats) ? stats : null;
      } catch (error) {
        console.warn('Initial member stats preparation failed', gameId, error);
        return null;
      }
    }

    function scheduleInitialMemberStatsRetry(memberKey, gameId, playerName) {
      (async () => {
        // renderPosters starts the first full-profile request immediately.
        // Do not overlap it with force refreshes; wait, reuse its result, and
        // retry from the shared Worker cache only if the card is still pending.
        // An uncached EWGF profile can legitimately take around 30 seconds.
        // Do not start a duplicate request while the first Worker request is
        // still parsing and preparing its shared cache.
        const retryDelays = [55000, 90000, 180000];
        for (const delay of retryDelays) {
          await new Promise(resolve => setTimeout(resolve, delay));
          const member = window.currentMembersData && window.currentMembersData[memberKey];
          if (
            !member ||
            !(member.initialFetchPending || member.fetchedStats?.initialFetchPending) ||
            cleanTekkenId(member.gameId).toUpperCase() !== cleanTekkenId(gameId).toUpperCase()
          ) {
            return;
          }
          const cached = getLocalStats(gameId, member);
          if (isUsableInitialMemberStats(cached)) return;
          scheduleBackgroundStatsFetch({ memberKey, gameId, playerName });
        }
      })();
    }

    async function saveMember(e) {
      e.preventDefault();
      const key = document.getElementById('editKey').value;
      const rawGameId = document.getElementById('inputId').value.trim();
      let gameId = cleanTekkenId(rawGameId);
      if (!gameId) {
        showToast('TEKKEN 8 ID繧貞・蜉帙＠縺ｦ縺上□縺輔＞');
        return;
      }

      const existingMember = key && window.currentMembersData ? window.currentMembersData[key] : null;
      const unchangedGameId = Boolean(existingMember)
        && cleanTekkenId(existingMember.gameId) === gameId;
      let resolvedPlayer;
      if (!key) {
        // A correctly shaped new ID must not keep the add dialog open while
        // external services resolve casing/name. The saved card completes
        // those lookups in the background.
        resolvedPlayer = { status: 'deferred', gameId, playerName: '' };
      } else if (unchangedGameId) {
        resolvedPlayer = {
          status: 'exact',
          gameId,
          playerName: String(existingMember.autoName || (existingMember.nameMode === 'auto' ? existingMember.name : '') || '').trim()
        };
      } else {
        const lookupSubmit = document.getElementById('btnSaveSubmit');
        const lookupOriginalLabel = lookupSubmit.textContent;
        lookupSubmit.disabled = true;
        lookupSubmit.textContent = 'TEKKEN 8 ID繧堤・蜷井ｸｭ...';
        resolvedPlayer = await resolveCanonicalTekkenId(gameId);
        lookupSubmit.disabled = false;
        lookupSubmit.textContent = lookupOriginalLabel;
      }
      if (resolvedPlayer.status === 'corrected') {
        const enteredId = gameId;
        gameId = resolvedPlayer.gameId;
        document.getElementById('inputId').value = gameId;
        showToast(`ID陦ｨ險倥ｒ閾ｪ蜍戊｣懈ｭ｣縺励∪縺励◆・・{enteredId} 竊・${gameId}`);
      } else if (resolvedPlayer.status === 'ambiguous') {
        showToast('螟ｧ譁・ｭ励・蟆乗枚蟄励□縺代〒縺ｯ繝励Ξ繧､繝､繝ｼ繧剃ｸ諢上↓迚ｹ螳壹〒縺阪∪縺帙ｓ縺ｧ縺励◆');
        return;
      }

      const normalizedGameId = gameId.toUpperCase();
      const duplicateEntry = Object.entries(window.currentMembersData || {}).find(([memberKey, member]) =>
        memberKey !== key && cleanTekkenId(member && member.gameId).toUpperCase() === normalizedGameId
      );
      if (duplicateEntry) {
        const duplicateName = duplicateEntry[1] && duplicateEntry[1].name ? duplicateEntry[1].name : '逋ｻ骭ｲ貂医∩繝励Ξ繧､繝､繝ｼ';
        alert(`TEKKEN 8 ID縲・{gameId}縲阪・縲√％縺ｮ繝ｪ繧ｹ繝医↓縲・{duplicateName}縲阪→縺励※譌｢縺ｫ逋ｻ骭ｲ縺輔ｌ縺ｦ縺・∪縺吶・n蜷後§ID繧貞酔縺倥Μ繧ｹ繝医∈隍・焚逋ｻ骭ｲ縺吶ｋ縺薙→縺ｯ縺ｧ縺阪∪縺帙ｓ縲Ａ);
        showToast('蜷後§TEKKEN 8 ID縺ｯ縺薙・繝ｪ繧ｹ繝医↓驥崎､・匳骭ｲ縺ｧ縺阪∪縺帙ｓ');
        return;
      }
      if (!key && !(await confirmNewPlayerId(gameId))) return;

      const submit = document.getElementById('btnSaveSubmit');
      const originalLabel = submit.textContent;
      submit.disabled = true;
      submit.textContent = '繝励Ξ繧､繝､繝ｼ諠・ｱ繧堤｢ｺ隱堺ｸｭ...';

      try {
        const enteredName = document.getElementById('inputName').value.trim();
        const nameWasEdited = document.getElementById('inputName').dataset.userEdited === 'true';
        let nameMode;
        if (!key) {
          nameMode = enteredName ? 'manual' : 'auto';
        } else if (!enteredName) {
          nameMode = 'auto';
        } else if (nameWasEdited) {
          nameMode = 'manual';
        } else if (existingMember?.nameMode === 'auto') {
          nameMode = 'auto';
        } else {
          // Legacy records deliberately default to manual. We cannot safely
          // infer whether an old matching name was typed by the user.
          nameMode = 'manual';
        }
        let name = enteredName;
        if (!name) {
          name = String(resolvedPlayer.playerName || '').trim();
          if (!name && key) {
            try {
              name = await fetchPlayerNameByGameId(gameId);
            } catch (nameError) {
              console.warn('Player name lookup failed', nameError);
              name = gameId;
            }
          }
          if (!name) name = gameId;
          document.getElementById('inputName').value = name;
        }

        const data = {
          name,
          nameMode,
          nameSource: nameMode === 'auto' ? 'wavu-profile' : 'user-input',
          nameUpdatedAt: Date.now(),
          autoName: String(resolvedPlayer.playerName || existingMember?.autoName || (nameMode === 'auto' ? name : '')).trim().slice(0, 50),
          autoNameUpdatedAt: Date.now(),
          gameId,
          subtitle: document.getElementById('inputSubtitle').value.trim(),
          xUrl: document.getElementById('inputXUrl').value.trim(),
          countryCode: normalizeCountryCode(document.getElementById('inputCountry').value),
          profileUrl: null,
          photoData: document.getElementById('photoData').value,
          color: selectedColor,
          updatedAt: Date.now()
        };
        if (!data.autoName) {
          delete data.autoName;
          delete data.autoNameUpdatedAt;
        }

        if (key) {
          const nameFields = {
            name: data.name,
            nameMode: data.nameMode,
            nameSource: data.nameSource,
            nameUpdatedAt: data.nameUpdatedAt
          };
          if (data.autoName) {
            nameFields.autoName = data.autoName;
            nameFields.autoNameUpdatedAt = data.autoNameUpdatedAt;
          }
          const [, syncedCount = 1] = await Promise.all([
            membersRef.child(key).update(data),
            typeof window.syncPlayerNameAcrossLists === 'function'
              ? window.syncPlayerNameAcrossLists(gameId, nameFields)
              : Promise.resolve(1)
          ]);
          closeModal('editModal');
          showToast(syncedCount > 1
            ? `${name} 繧呈峩譁ｰ縺励∝酔縺露D縺ｮ${syncedCount}莉ｶ縺ｸ蜿肴丐縺励∪縺励◆`
            : `${name} 繧呈峩譁ｰ縺励∪縺励◆`);
        } else {
          // Firebase rules intentionally allow arbitrary fetchedStats children,
          // while member-level fields are allowlisted. Save the card first and
          // finish all external lookups after the modal has closed.
          data.fetchedStats = {
            initialFetchPending: true,
            initialFetchPendingAt: Date.now(),
            cachedAt: 0,
            fetchMeta: {
              state: 'saved',
              savedAt: Date.now(),
              schema: '20260729-acquisition-pipeline'
            }
          };
          data.order = Date.now();
          const newMemberRef = membersRef.push();
          await newMemberRef.set(data);
          closeModal('editModal');
          showToast(`${name} 繧定ｿｽ蜉縺励∪縺励◆縲ゅョ繝ｼ繧ｿ縺ｯ繝舌ャ繧ｯ繧ｰ繝ｩ繧ｦ繝ｳ繝峨〒蜿門ｾ励＠縺ｾ縺兪);
          scheduleBackgroundStatsFetch({ memberKey: newMemberRef.key, gameId, playerName: name });
          scheduleInitialMemberStatsRetry(newMemberRef.key, gameId, name);
          // The parallel full-profile pipeline now returns the player name too.
          // Canonical-ID search is reserved for profile failures/case repair.
        }
      } catch (err) {
        console.error('Member save failed', err);
        showToast(`菫晏ｭ倥お繝ｩ繝ｼ: ${err.code || err.message}`);
      } finally {
        submit.disabled = false;
        submit.textContent = originalLabel;
      }
    }
    function confirmDelete() {
      if (document.body.classList.contains('shared-list-readonly')) {
        closeModal('deleteModal');
        showToast('髢ｲ隕ｧ蟆ら畑繝ｪ繧ｹ繝医°繧峨・蜑企勁縺ｧ縺阪∪縺帙ｓ');
        return;

    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      if (toastTimer) clearTimeout(toastTimer);
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function startEditTitle() {
      const titleEl = document.getElementById('pageTitle');
      const input = document.getElementById('titleInput');
      const currentTitle = document.getElementById('titleText').textContent;

      titleEl.style.display = 'none';
      input.style.display = 'inline-block';
      input.value = currentTitle;
      input.focus();
      input.select();

      input.onblur = () => saveTitle();
      input.onkeydown = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); saveTitle(); }
        if (e.key === 'Escape') { cancelEditTitle(); }
      };
    }

    function saveTitle() {
      const titleEl = document.getElementById('pageTitle');
      const input = document.getElementById('titleInput');
      const newTitle = input.value.trim();

      input.onblur = null;
      input.style.display = 'none';
      titleEl.style.display = '';

      if (newTitle) {
        document.getElementById('titleText').textContent = newTitle;
        document.title = `諡ｳ繝医Δ縺上ｓ / ${newTitle}`;
      }
    }

    function cancelEditTitle() {
      const titleEl = document.getElementById('pageTitle');
      const input = document.getElementById('titleInput');
      input.onblur = null;
      input.style.display = 'none';
      titleEl.style.display = '';
    }

    // GitHub Pages縺ｧ蜿､縺・ndex.html縺梧ｮ九ｉ縺ｪ縺・ｈ縺・∽ｻ･蜑阪・Service Worker縺ｨ縺昴・繧ｭ繝｣繝・す繝･繧定ｧ｣髯､縺吶ｋ縲・    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
          if ('caches' in window) {
            const cacheNames = await caches.keys();
            await Promise.all(cacheNames.map(cacheName => caches.delete(cacheName)));
          }
          if (navigator.serviceWorker.controller && !sessionStorage.getItem('t8_sw_cleanup_reloaded')) {
            sessionStorage.setItem('t8_sw_cleanup_reloaded', '1');
            location.reload();
          }
        } catch (error) {
          console.warn('Service Worker cleanup failed:', error);
        }
      });
    }

    (() => {
